[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aita-nfl-model"
version = "0.3.0a2"
description = "AITA NFL opportunity-first player alpha pricing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.17",
  "pyarrow>=17",
  "requests>=2.32",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
  "tabulate>=0.9",
  "nflreadpy>=0.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[project.scripts]
nfl-model = "nfl_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
